name: CI

# CI del ERP (cada push y cada PR). Cuatro jobs en paralelo:
#   calidad            · lint PHP + pruebas EAN-13 + build de producción
#   phpstan            · análisis estático larastan nivel 6 (baseline = deuda
#                        histórica congelada; CUALQUIER error nuevo rompe)
#   pest               · suite completa (Pest + PHPUnit) contra clones
#                        DEDICADO fresco (tienda_pest desde tiendaunica) sin tocar
#                        TEMPLATE)
#   t19-regresion      · regresión de hallazgos de auditoría (68) +
#                        trazabilidad requisitos↔suites (40)
#
# La base la pone un contenedor de servicio postgres:17 con trust auth; la
# instalación (scripts 00–43 + semilla) la hace scripts/infra/setup_db.py.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Sintaxis PHP (app, routes, tests)
        run: find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prueba EAN-13 (PHP)
        run: php tests/ean/ean13.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Prueba EAN-13 (JS, incluye garantía de quiet zone)
        run: node tests/ean/ean13.test.mjs

      - name: Build de producción
        run: npm run build

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan nivel 6 (el baseline congela la deuda histórica)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependencias Node + build de Vite
        run: |
          npm ci
          npm run build

      - name: Dependencias Python (setup_db usa psycopg2)
        run: pip install psycopg2-binary

      # Igual que t19-regresion: sin este paso Laravel arranca sin APP_KEY
      # (MissingAppKeyException) porque .env no viaja en el repo.
      - name: .env de CI desde el ejemplo (puertos 5433, clave de testing)
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:QVIY3sKO1zlz74jPWiLlK8EzSyJugoEZ7kenZi357Js=/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5433/' .env

      - name: Instalación limpia de la base (scripts 01–41 + semilla)
        env:
          PGHOST: 127.0.0.1
        run: python3 scripts/infra/setup_db.py

      - name: Clon dedicado de Pest desde TEMPLATE tiendaunica
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres \
            -c 'CREATE DATABASE tienda_pest TEMPLATE tiendaunica'

      - name: Pest (suite completa)
        env:
          DB_PORT: 5433
        run: vendor/bin/pest --compact

  t19-regresion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependencias Node + build de Vite
        run: |
          npm ci
          npm run build

      - name: PostgreSQL 17 para pg_dump/pg_restore (t19 clona con dumps)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Dependencias Python
        run: pip install psycopg2-binary requests

      - name: .env de CI desde el ejemplo (puertos 5433, clave de testing)
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:QVIY3sKO1zlz74jPWiLlK8EzSyJugoEZ7kenZi357Js=/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5433/' .env

      - name: Instalación limpia de la base (scripts 01–41 + semilla)
        env:
          PGHOST: 127.0.0.1
        run: python3 scripts/infra/setup_db.py

      - name: t19 · regresión de hallazgos de auditoría (68 verificaciones)
        env:
          PGHOST: 127.0.0.1
          PGBIN: /usr/lib/postgresql/17/bin
        run: python3 tests/security/regresion_hallazgos.py | tee /tmp/t19.log

      - name: Trazabilidad requisitos ↔ suites (40/40)
        run: python3 tests/trazabilidad.py | tee /tmp/trazabilidad.log

      - name: Logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-t19
          path: |
            /tmp/t19.log
            /tmp/trazabilidad.log
          retention-days: 7
          if-no-files-found: ignore
