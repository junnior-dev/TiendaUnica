name: Nightly

# Cadena completa nocturna (04:30 hora Venezuela). Lo que no cabe en el CI de
# cada push por coste/duración:
#   suites-python      · t01–t15 + f01–f17 + m01–m13 + p01–p03 (688) vía
#                        scripts/infra/run_suites.py, más t16/t17/t18 contra el
#                        servidor HTTP con assets construidos, y trazabilidad.
#   carga-continuidad  · k6 (latencia + rampa + ventas) → concurrencia_pg →
#                        continuidad (backup/restore/migración/rollback) contra
#                        una base CON ventas reales (c2 necesita datos que cruzar).
on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 04:30 Caracas
  workflow_dispatch:        # botón de "correr ahora" en Actions

# Un solo nightly a la vez. A diferencia del CI de push, NO se cancela el
# que corre: cancelar 45 min de validación por un solape accidental es peor
# que dejarlo terminar.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suites-python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependencias Node + build de Vite (t18 lo necesita)
        run: |
          npm ci
          npm run build

      - name: Dependencias Python (suites + Playwright/Chromium para t18)
        run: |
          pip install psycopg2-binary requests faker playwright
          playwright install --with-deps chromium

      - name: .env de CI desde el ejemplo (puertos 5433, clave de testing)
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:QVIY3sKO1zlz74jPWiLlK8EzSyJugoEZ7kenZi357Js=/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5433/' .env

      - name: Instalación limpia de la base (scripts 01–41 + semilla)
        env:
          PGHOST: 127.0.0.1
        run: python3 scripts/infra/setup_db.py

      # ORDEN del run_all.sh: los funcionales ANTES de t16–t18. Las suites crean
      # sus clones desde TEMPLATE «tienda» y exigen la plantilla PRISTINA: si
      # t18 (que vende contra la base real) corre primero, las pruebas de
      # multiinquilino chocan con las FK de las ventas que dejó (m04).
      - name: Funcionales t/f/m/p (688 aserciones, clones desde TEMPLATE)
        run: python3 scripts/infra/run_suites.py /tmp/suites.log | tail -3
        env:
          PGHOST: 127.0.0.1

      - name: Servidor HTTP en :8000 (workers) + limpieza del throttle
        env:
          PHP_CLI_SERVER_WORKERS: 8
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/up && break; sleep 1; done
          php artisan cache:clear || true

      - name: t16 · páginas Inertia (71)
        run: python3 tests/e2e/t16_paginas_inertia.py | tee /tmp/t16.log | tail -2

      - name: t17 · concurrencia (33)
        run: python3 tests/e2e/t17_concurrencia.py | tee /tmp/t17.log | tail -2

      - name: t18 · navegador E2E (19 pasos)
        run: python3 tests/e2e/t18_e2e_navegador.py | tee /tmp/t18.log | tail -2

      - name: Trazabilidad requisitos ↔ suites (40/40)
        run: python3 tests/trazabilidad.py | tee /tmp/trazabilidad.log

      - name: Logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-suites
          path: |
            /tmp/serve.log
            /tmp/t16.log
            /tmp/t17.log
            /tmp/t18.log
            /tmp/suites.log
            /tmp/trazabilidad.log
          retention-days: 7
          if-no-files-found: ignore

  carga-continuidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependencias Node + build de Vite
        run: |
          npm ci
          npm run build

      - name: k6 v2.4.0 (binario de GitHub releases) y cliente PostgreSQL 17
        # El repo apt de k6 exige una clave del keyserver de Ubuntu por puerto 80:
        # el runner la pidió y recibió «No data» (falla intermitente del keyserver).
        # El binario pinneado de GitHub releases no depende de ningún keyserver.
        run: |
          curl -sSL -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo install /tmp/k6-v2.4.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Dependencias Python
        run: pip install psycopg2-binary

      - name: .env de CI desde el ejemplo (puertos 5433, clave de testing)
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:QVIY3sKO1zlz74jPWiLlK8EzSyJugoEZ7kenZi357Js=/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5433/' .env

      - name: Instalación limpia de la base (scripts 01–41 + semilla)
        env:
          PGHOST: 127.0.0.1
        run: python3 scripts/infra/setup_db.py

      - name: Servidor HTTP en :8000 (workers) + limpieza del throttle
        env:
          PHP_CLI_SERVER_WORKERS: 8
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/up && break; sleep 1; done
          php artisan cache:clear || true

      - name: k6 · latencia por endpoint (1 VU × 30)
        run: k6 run scripts/carga/k6_latencia.js | tee /tmp/k6_latencia.log | grep -E "checks|http_req_duration" | tail -4

      - name: k6 · rampa 1 minuto (escalado de VUs)
        run: k6 run scripts/carga/k6_rampa.js | tee /tmp/k6_rampa.log | grep -E "checks|http_req_duration|vus_max" | tail -4

      - name: k6 · ventas por HTTP (deja la base CON ventas)
        run: k6 run scripts/carga/k6_ventas.js | tee /tmp/k6_ventas.log | grep -E "checks|http_req_duration|iterations" | tail -4

      - name: Concurrencia PostgreSQL (escenarios A/B/C sobre clon tienda_carga)
        run: python3 scripts/carga/concurrencia_pg.py | tee /tmp/carga_pg.log | tail -6
        env:
          PGHOST: 127.0.0.1

      - name: Continuidad backup→restore→migración→rollback (c1–c5)
        run: python3 scripts/infra/continuidad.py | tee /tmp/continuidad.log
        env:
          PGHOST: 127.0.0.1
          PGBIN: /usr/lib/postgresql/17/bin

      - name: Logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-carga
          path: |
            /tmp/serve.log
            /tmp/k6_*.log
            /tmp/carga_pg.log
            /tmp/continuidad.log
          retention-days: 7
          if-no-files-found: ignore
