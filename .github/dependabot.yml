# Dependabot QUIRÚRGICO · solo seguridad, cero ruido.
#
# Qué hace: solo PRs cuando hay CVE (Dependabot security updates, se activa
# aparte en Settings). NO abre PRs de versión: el stack está fijado a mano
# (lucide-react 1.67.0, jspdf 4.2.1, dompurify 3.4.18 vía overrides) y un bump
# casual rompería el pin sin razón.
#
# El truco VERIFICADO EMPÍRICAMENTE (16-nov-2026, repo de test privado con
# lodash 4.17.20 y minimist 1.2.0 vulnerables conocidos — evidencia en
# CHANGES.md): limit 0 desactiva las actualizaciones de VERSIÓN; los security
# updates siguen vivos, abren SOLOS al detectar el CVE y respetan los groups
# con applies-to: security-updates (2 fixes agrupados en 1 PR en la prueba).
#
# Cuando quieras habilitar versiones por semana: cambia los tres límites a 3
# y el schedule lunes 06:00 UTC (02:00 Caracas) entra en acción tal cual.
#
# Los PRs que abra quedan validados por el CI completo (Pest + PHPStan + t19)
# ANTES de fusionar: el valor real es «avisa y dice si el fix rompe algo».
version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Caracas
    open-pull-requests-limit: 0   # versiones OFF; security updates siguen vivos
    groups:
      parches-menores:
        applies-to: security-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Caracas
    open-pull-requests-limit: 0
    groups:
      parches-menores:
        applies-to: security-updates
        update-types:
          - patch
          - minor

  # Solo github-actions con security: que NO te cambie @v4 por @v4.1.2 a mano.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Caracas
    open-pull-requests-limit: 0
