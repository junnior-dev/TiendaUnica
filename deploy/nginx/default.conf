# Nginx frente a php-fpm · la única puerta pública del staging.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Los activos compilados por Vite van directo, sin tocar PHP.
    location /build/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;

        # Cabeceras reales para logs y rate-limiters (LogContexto y Permisos
        # usan $request->ip(): sin esto todo el staging se ve como una IP).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;   # nginx genera el id si no llega
        fastcgi_read_timeout 60s;
    }

    # Nada de storage/, .env, composer.json… vía HTTP.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
